spring:
  application:
    name: sistema-medico-app-runner
  datasource:
    url: jdbc:mysql://localhost:3306/sistema_turnos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:cambiame-en-produccion-minimo-256-bits-para-hs256-algoritmo}
      expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:5173