spring:
  application:
    name: sistema-medico-app-runner
  main:
    web-application-type: none
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sistema_turnos}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:cambiame-en-produccion-minimo-256-bits-para-hs256-algoritmo}
      expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  file:
    name: ${LOG_PATH:sistema-medico-backend.log}
  level:
    root: INFO
